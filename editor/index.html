<!doctype html>
<!--
  Quiz Board Engine — board editor (F13, delta D19).
  SPDX-License-Identifier: AGPL-3.0-or-later

  A SEPARATE PAGE FROM THE GAME, on purpose. index.html never loads this and this never loads the
  game; the two share modules, not a page. If the editor is wrong the worst case is a bad file that
  the validator refuses — it cannot break a board that is already on a projector.

  Serve the repo root over HTTP and open http://localhost:8000/editor/ —
  file:// blocks ES module imports and fetch, and there is no way around that.

  Styling lives here rather than in themes/: those files are the GAME's contract (theme-contract §2)
  and every class in them is one the renderer emits. The editor's chrome is not part of that
  contract and must not start looking like it is.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="../">
<title>Board editor — Quiz Board Engine</title>
<style>
  :root {
    color-scheme: light dark;
    --ed-ok: #1a7f37;
    --ed-bad: #cf222e;
    --ed-rule: rgba(128, 128, 128, .35);
  }
  @media (prefers-color-scheme: dark) {
    :root { --ed-ok: #4ec97b; --ed-bad: #ff8f85; }
  }
  body {
    font: 15px/1.5 system-ui, sans-serif;
    margin: 0 auto;
    max-width: 62rem;
    padding: 2rem 1.5rem 6rem;
  }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .lede { margin: 0 0 2rem; opacity: .75; }
  .lede code { font-family: ui-monospace, Menlo, monospace; }

  .ed-field { display: block; margin: .75rem 0; }
  .ed-field-label {
    display: block;
    font-size: .8rem;
    text-transform: uppercase;
    letter-spacing: .06em;
    opacity: .7;
    margin-bottom: .2rem;
  }
  .ed-input {
    font: inherit;
    width: 100%;
    box-sizing: border-box;
    padding: .45rem .6rem;
    border: 1px solid var(--ed-rule);
    border-radius: 6px;
    background: Canvas;
    color: CanvasText;
  }

  .ed-btn {
    font: inherit;
    padding: .4rem .8rem;
    border: 1px solid var(--ed-rule);
    border-radius: 6px;
    background: Canvas;
    color: CanvasText;
    cursor: pointer;
  }
  .ed-btn:hover:not(:disabled) { border-color: CanvasText; }
  /* A disabled control must LOOK unavailable, not just behave that way — the same reasoning the
     game applies to its score buttons. */
  .ed-btn:disabled { opacity: .45; cursor: not-allowed; }
  .ed-primary { font-weight: 600; padding: .6rem 1.2rem; margin-top: 1.5rem; }

  .ed-open { margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--ed-rule); }
  .ed-open .ed-input { display: inline-block; width: 22rem; max-width: 100%; margin-right: .5rem; }

  .ed-round {
    border: 1px solid var(--ed-rule);
    border-radius: 8px;
    padding: 1rem 1.2rem;
    margin: 1rem 0;
  }
  .ed-round-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .ed-round-title { font-size: 1rem; margin: 0; }
  .ed-round-tools { display: flex; gap: .35rem; }

  .ed-answer {
    display: grid;
    grid-template-columns: 1fr 7rem auto;
    gap: .75rem;
    align-items: end;
    margin: .5rem 0;
  }
  .ed-answer-tools { display: flex; gap: .25rem; padding-bottom: .1rem; }

  .ed-verdict {
    border: 2px solid var(--ed-rule);
    border-radius: 8px;
    padding: .9rem 1.1rem;
    margin-top: 2rem;
  }
  .ed-verdict.ok { border-color: var(--ed-ok); }
  .ed-verdict.ok strong { color: var(--ed-ok); }
  .ed-verdict.bad { border-color: var(--ed-bad); }
  .ed-verdict.bad strong { color: var(--ed-bad); }
  .ed-problems { margin: .5rem 0 0; padding-left: 1.2rem; }
  .ed-problems li { margin: .35rem 0; }

  /* The export reason is VISIBLE text, not a title attribute: `title` is mouse-hover only and a
     disabled button is out of the tab order, so the reason reached nobody who needed it most. */
  .ed-export-reason { margin: .5rem 0 0; color: var(--ed-bad); max-width: 46rem; }
  .ed-open-message { margin: .5rem 0 0; max-width: 46rem; }

  /* Announced, never shown. The verdict panel repaints on every keystroke, so the panel itself
     cannot carry aria-live without reading the whole problem list aloud per character; this speaks
     only when the verdict flips. Clipped rather than display:none, which removes it from the
     accessibility tree entirely and would announce nothing. */
  .ed-live {
    position: absolute;
    width: 1px; height: 1px;
    margin: -1px; padding: 0; border: 0;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

  /* ---- The host's answer sheet (F15, delta D23) ---------------------------------------------
     NOT ON SCREEN. The sheet is a second rendering of the same board, and two copies of it visible
     at once is a document with a form stapled to it — the host reads one and edits the other. It is
     drawn into the page so the print dialog has something to render and nothing else. */
  .ed-sheet { display: none; }

  @media print {
    /* BLACK ON WHITE REGARDLESS OF prefers-color-scheme. Everything above paints in the system
       colours (Canvas / CanvasText), which a browser in dark mode resolves to pale-on-dark — on
       paper that is a flooded page, or, once the printer's "ignore background colours" default has
       had its say, white text on nothing. `color-scheme: light` re-resolves the system colours, and
       the explicit #000/#fff do not depend on that having worked. */
    :root { color-scheme: light; }
    html, body { background: #fff !important; color: #000 !important; }

    /* The editing chrome is not a document. Every control, the open row, the verdict panel, the
       manifest line and the lede come off the page; `button` is listed as well as `.ed-btn` so a
       control added later without the class cannot print by omission. */
    .lede, h1, .ed-open, .ed-meta, .ed-rounds, .ed-verdict, .ed-export-reason,
    .ed-manifest, .ed-btn, button { display: none !important; }

    .ed-sheet { display: block !important; background: #fff; color: #000; }
    .ed-sheet-title { font-size: 1.5rem; margin: 0 0 .4rem; }
    .ed-sheet-draft {
      display: inline-block;
      margin: 0 0 1rem;
      padding: .25rem .5rem;
      border: 2px solid #000;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    /* A round that straddles a page break separates an answer from its question, which is the one
       thing the host is holding the paper for. */
    .ed-sheet-round { margin: 0 0 1.25rem; break-inside: avoid; page-break-inside: avoid; }
    .ed-sheet-question { font-size: 1.05rem; margin: 0 0 .35rem; }
    .ed-sheet-answers { margin: 0; padding-left: 1.6rem; }
    .ed-sheet-answer { margin: .2rem 0; }
    /* THE ANSWER WRAPS, and that is the entire reason this feature is a built sheet rather than a
       stylesheet over the form: an <input> prints only what fits its box and clips the rest with
       nothing on the paper to say so. 2000 characters is a legal answer. */
    .ed-sheet-answer-text { overflow-wrap: anywhere; }
    .ed-sheet-answer-value { font-weight: 700; }
    .ed-sheet-answer-value::before { content: ' \2014 '; font-weight: 400; }
    .ed-sheet-total { margin: .4rem 0 0; font-weight: 700; }
  }

  .ed-manifest { margin-top: 1rem; }
  .ed-manifest-line {
    display: inline-block;
    font-family: ui-monospace, Menlo, monospace;
    padding: .4rem .6rem;
    border: 1px solid var(--ed-rule);
    border-radius: 6px;
    user-select: all;
  }
</style>
</head>
<body>
  <h1>Board editor</h1>
  <p class="lede">
    Authors a <strong>ranked-answers</strong> board. Every keystroke is checked by the same
    validator the game uses, so a board that is valid here will load there. Download the file, drop
    it in <code>games/</code>, and add the line it gives you to <code>games.json</code>.
  </p>
  <main id="editor"></main>
  <script type="module">
    import { boot } from './editor/editor.js';
    boot().catch((err) => console.error('Board editor failed to start:', err));
  </script>
</body>
</html>
